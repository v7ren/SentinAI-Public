[package]
name = "sentinai_index"
version = "0.1.0"
edition = "2021"
description = "Fast local project indexer for SentinAI (symbols, deps, call graph, sanitizers, keywords)"
license = "MIT"

[lib]
name = "sentinai_index"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
once_cell = "1"

[profile.release]
lto = true
codegen-units = 1
