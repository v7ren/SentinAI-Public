<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <style>
      /* Animation Keyframes */
      @keyframes exp-top {
        0%, 15%, 85%, 100% { transform: translate(0, 0); }
        45%, 55% { transform: translate(0, -36px); }
      }
      @keyframes exp-left {
        0%, 15%, 85%, 100% { transform: translate(0, 0); }
        45%, 55% { transform: translate(-31px, 18px); }
      }
      @keyframes exp-right {
        0%, 15%, 85%, 100% { transform: translate(0, 0); }
        45%, 55% { transform: translate(31px, 18px); }
      }
      @keyframes star-spin-constant {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes z-scan-continuous {
        0% { transform: translateY(-50px); }
        100% { transform: translateY(50px); }
      }

      /* Animation Classes */
      .exp-t { animation: exp-top 6s cubic-bezier(0.5, 0, 0.2, 1) infinite; }
      .exp-l { animation: exp-left 6s cubic-bezier(0.5, 0, 0.2, 1) infinite; }
      .exp-r { animation: exp-right 6s cubic-bezier(0.5, 0, 0.2, 1) infinite; }
      .star-constant { animation: star-spin-constant 12s linear infinite; transform-origin: 128px 128px; }
      .scan-continuous { animation: z-scan-continuous 3s ease-in-out infinite alternate; }
    </style>

    <!-- Native SVG Glow Filter for maximum compatibility -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background (Optional: Remove or change if your site background isn't dark) -->
  <!-- <rect width="256" height="256" fill="#050505" /> -->

  <!-- AI Star (Always glowing and spinning, but physically hidden by the panes below) -->
  <path class="star-constant" d="M 128 92 C 128 116 112 128 92 128 C 112 128 128 140 128 164 C 128 140 144 128 164 128 C 144 128 128 116 128 92 Z" fill="#ffffff" filter="url(#glow)" />

  <!-- Solid Opaque Panes (Foreground Layer) -->
  <!-- The fill is set to #050505 to match a dark theme and physically occlude the star -->
  <g class="exp-t">
    <polygon points="128,38 206,83 128,128 50,83" fill="#050505" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
  </g>

  <g class="exp-l">
    <polygon points="50,83 128,128 128,218 50,173" fill="#050505" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
  </g>

  <g class="exp-r">
    <polygon points="128,128 206,83 206,173 128,218" fill="#050505" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- Z-Scan (Foreground Layer - Scans the OUTSIDE of the solid box) -->
  <g class="scan-continuous" style="pointer-events: none;">
    <polygon points="50,128 128,83 206,128 128,173" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" opacity="0.6" />
  </g>
</svg>